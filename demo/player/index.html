<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jianpu Player Demo</title>
    <!-- Include Tone.js for Audio Playback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Include the minified built OSMD module -->
    <script src="js/opensheetmusicdisplay.min.js"></script>
    <!-- Include our custom player script -->
    <script src="player.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #osmd-container {
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            border: 1px solid #ccc;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>OpenSheetMusicDisplay: Jianpu Demo</h1>

    <!-- Sample Selector -->
    <div id="sample-selector-container" style="margin-bottom: 20px;">
        <label for="selectSample">Select a sample: </label>
        <select id="selectSample" style="font-size: 16px; padding: 5px;">
            <option value="Twinkle_Twinkle_Little_Star.musicxml">Twinkle Twinkle Little Star</option>
            <option value="/test_jianpu_simple.musicxml">Jianpu Simple</option>
            <option value="/test_jianpu_scale_3measures.musicxml">Jianpu Scale</option>
            <option value="/test_jianpu_voices_2measures_simple.musicxml">Jianpu Voices</option>
            <option value="/MuzioClementi_SonatinaOpus36No1_Part1.xml">Clementi Sonatina</option>
            <option value="/JohannSebastianBach_Air.xml">Bach Air</option>
        </select>
    </div>

    <!-- Player Controls -->
    <div id="controls" style="margin-bottom: 20px;">
        <button id="btn-play" style="font-size: 16px; padding: 5px 15px;">Play</button>
        <button id="btn-pause" style="font-size: 16px; padding: 5px 15px;">Pause</button>
        <button id="btn-stop" style="font-size: 16px; padding: 5px 15px;">Stop</button>
        
        <span style="margin-left: 20px; font-size: 16px;">
            <label for="bpm-slider">BPM: </label>
            <input type="range" id="bpm-slider" min="30" max="240" value="120" />
            <span id="bpm-display">120</span>
        </span>
        
        <span style="margin-left: 20px; font-size: 16px;">
            <label for="transpose">Transpose: </label>
            <input type="number" id="transpose" value="0" style="width: 50px; font-size: 16px;" />
            <button id="transpose-btn" style="font-size: 14px; padding: 3px 10px;">Apply</button>
        </span>
        
        <span style="margin-left: 20px; font-size: 16px;">
            <label for="selectPageSize">Page Size: </label>
            <select id="selectPageSize" style="font-size: 16px; padding: 3px;">
                <option value="endless">endless</option>
                <option value="A3 P">A3 Portrait</option>
                <option value="A3 L">A3 Landscape</option>
                <option value="A4 P">A4 Portrait</option>
                <option value="A4 L">A4 Landscape</option>
                <option value="A5 P">A5 Portrait</option>
                <option value="A5 L">A5 Landscape</option>
                <option value="Letter P">Letter Portrait</option>
                <option value="Letter L">Letter Landscape</option>
            </select>
        </span>
    </div>

    <!-- Track Selectors -->
    <div id="track-selectors" style="margin-bottom: 20px;">
        <!-- Checkboxes will be populated here by player.js -->
    </div>

    <div id="osmd-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Initialize OpenSheetMusicDisplay inside the container
            var osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
                autoResize: true,
                backend: "svg",
                drawingParameters: "default", // You could also use "compact" or "compacttight"
                rules: {
                    JianpuAlwaysUsed: true // Force Jianpu formatting
                }
            });
            window.osmd = osmd; // expose for player.js

            var sampleUrl = "Twinkle_Twinkle_Little_Star.musicxml";
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has("sample")) {
                sampleUrl = urlParams.get("sample");
            }
            
            var selectSample = document.getElementById("selectSample");
            if (selectSample) {
                selectSample.value = sampleUrl;
                selectSample.addEventListener("change", function(e) {
                    window.location.search = "?sample=" + encodeURIComponent(e.target.value);
                });
            }

            // Load the MusicXML and render it
            osmd.load(sampleUrl).then(function () {
                console.log("MusicXML loaded successfully");
                osmd.render();
                console.log("Jianpu rendered successfully");
            }).catch(function (error) {
                console.error("Error loading or rendering MusicXML:", error);
            });
        });
    </script>
</body>
</html>
